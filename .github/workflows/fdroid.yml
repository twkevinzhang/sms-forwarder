name: F-Droid recipe verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-recipe-verification
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and scan with official F-Droid tooling
        run: bash scripts/verify_fdroid.sh
