name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      approved: ${{ steps.validation.outputs.approved }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, version, main ancestry and listing approval
        id: validation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py check --tag "$RELEASE_TAG" --check-main --github-output
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and build unsigned release
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-release-candidate-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Explain draft gate
        if: steps.validation.outputs.approved != 'true'
        run: echo 'Build completed. Publication is blocked until the store listing and screenshots are reviewed and approved.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: needs.build.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Recheck approval
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py check --tag "$RELEASE_TAG" --require-approval
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file fdroid/RELEASE_NOTES.md
